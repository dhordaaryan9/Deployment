name: Build, Push, and Deploy to Render

on:
  push:
    branches:
      - main # Change this to 'master' if your repo uses master instead of main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v4
        with:
          context: .
          push: true
          # IMPORTANT: Change 'your-app-name' to the name of your project
          tags: ${{ secrets.DOCKER_USERNAME }}/deployment:latest 

      - name: Trigger Render Deploy
        run: curl ${{ secrets.RENDER_DEPLOY_HOOK }}
